
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: visionguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: visionguard

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - visionguard_network

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: visionguard-flask:latest

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      DATABASE_URL: postgresql+psycopg://visionguard:${POSTGRES_PASSWORD}@db:5432/visionguard
      MODEL_PATH: /visionguard/models/mobilenetv2_tuned.keras
      PREDICTION_THRESHOLD: "0.70"
      MAX_UPLOAD_MB: "10"
      FLASK_DEBUG: "false"

    volumes:
      - ./models/mobilenetv2_tuned.keras:/visionguard/models/mobilenetv2_tuned.keras:ro

    depends_on:
      db:
        condition: service_healthy

    networks:
      - visionguard_network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  visionguard_network:
    driver: bridge

volumes:
  postgres_data:
