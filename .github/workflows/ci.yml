
name: VisionGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test Flask and Build Docker
    runs-on: ubuntu-latest

    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      MODEL_PATH: models/mobilenetv2_tuned.keras
      DATABASE_URL: sqlite:///visionguard_ci.db
      FLASK_DEBUG: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.docker.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt

      - name: Generate temporary CI assets
        run: python -m tests.prepare_ci_assets

      - name: Check Python syntax
        run: python -m compileall -q app tests

      - name: Install Ruff linter
        run: pip install ruff
      
      - name: Lint Python code
        run: ruff check app tests --select E4,E9,F63,F7,F82

      - name: Run Flask and database tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

      - name: Build Docker image
        run: docker build -t visionguard-flask:ci .
